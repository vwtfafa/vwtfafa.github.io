<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Silkscreen";
        src: url("../public/fonts/silkscreen-700.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Silkscreen";
        src: url("../public/fonts/silkscreen-400.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0b0f0c;
        color: #e8f0e9;
        font-family: "Silkscreen", monospace;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 90px;
        position: relative;
        overflow: hidden;
      }
      .grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(74, 222, 91, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(74, 222, 91, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .glow {
        position: absolute;
        width: 700px;
        height: 700px;
        right: -150px;
        top: -200px;
        background: radial-gradient(
          circle,
          rgba(74, 222, 91, 0.12) 0%,
          transparent 65%
        );
      }
      .left {
        position: relative;
      }
      .badge-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
      }
      .cube {
        width: 34px;
        height: 34px;
        background: linear-gradient(135deg, #4ade5b, #22c032);
        box-shadow:
          5px 5px 0 rgba(74, 222, 91, 0.3),
          inset -4px -4px 0 rgba(0, 0, 0, 0.25);
      }
      .site {
        font-size: 22px;
        color: #8fa396;
      }
      h1 {
        font-size: 96px;
        color: #4ade5b;
        text-shadow: 6px 6px 0 rgba(34, 192, 50, 0.25);
        margin-bottom: 20px;
        letter-spacing: -2px;
      }
      .tagline {
        font-size: 32px;
        color: #e8f0e9;
        margin-bottom: 34px;
      }
      .stats {
        display: flex;
        gap: 16px;
      }
      .stat {
        border: 2px solid #2f4a35;
        background: #121813;
        color: #8fa396;
        font-size: 19px;
        padding: 12px 22px;
        box-shadow: 5px 5px 0 rgba(74, 222, 91, 0.12);
      }
      .stat b {
        color: #4ade5b;
      }
      .avatar {
        position: relative;
        width: 320px;
        height: 320px;
        image-rendering: pixelated;
        border: 3px solid #2f4a35;
        background: #121813;
        padding: 18px;
        box-shadow:
          14px 14px 0 rgba(74, 222, 91, 0.12),
          0 0 80px rgba(74, 222, 91, 0.15);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div class="grid-bg"></div>
    <div class="glow"></div>
    <div class="left">
      <div class="badge-row">
        <span class="cube"></span>
        <span class="site">vwtfafa.github.io</span>
      </div>
      <h1>vwtfafa</h1>
      <p class="tagline">Minecraft Developer</p>
      <div class="stats">
        <span class="stat"><b>13.9K+</b> Downloads</span>
        <span class="stat"><b>100%</b> Open Source</span>
      </div>
    </div>
    <div class="avatar">
      <img src="../public/icons/icon-512.png" alt="" />
    </div>
  </body>
</html>
